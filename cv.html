<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>둘궁 (dukzy) | Official Profile</title>
    <style>
        /* Google Fonts - Modern Sans Serif */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f2f5;
            color: #1a1a1a;
            overflow-x: hidden;
        }

        /* 배경 애니메이션 (Background Animation) */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #001f3f, #003366, #001f3f);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            z-index: -1;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Header Section */
        header {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .profile-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 30px;
        }

        .profile-circle {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 70px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -2px;
        }

        header .nickname {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.8;
            background: rgba(255,255,255,0.2);
            padding: 4px 15px;
            border-radius: 20px;
        }

        header .info {
            margin-top: 15px;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Main Content Section */
        main {
            max-width: 800px;
            margin: -60px auto 80px;
            padding: 0 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 1.6rem;
            color: #001f3f;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            font-weight: 700;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .section-title span {
            margin-right: 12px;
            font-size: 1.8rem;
        }

        /* Tags Styling */
        .tag-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .tag {
            background: linear-gradient(135deg, #001f3f, #003366);
            color: white;
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.95rem;
            box-shadow: 0 5px 15px rgba(0,31,63,0.2);
            transition: transform 0.3s ease;
        }

        .tag:hover {
            transform: translateY(-3px);
        }

        /* List Styling */
        .list-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            font-size: 1.15rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .list-item:last-child { border-bottom: none; }

        .list-item::before {
            content: "✔️";
            margin-right: 15px;
            font-size: 1rem;
        }

        /* Contact Section */
        .contact-box {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-top: 20px;
        }

        .phone-link {
            display: inline-block;
            background: #28a745; /* Green color */
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(40,167,69,0.3);
            transition: all 0.3s ease;
        }

        .phone-link:hover {
            transform: scale(1.05);
            background: #218838;
        }

        /* Goal Section */
        .goal-text {
            font-size: 1.3rem;
            font-style: italic;
            color: #001f3f;
            text-align: center;
            line-height: 1.6;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 { font-size: 2.5rem; }
            .glass-card { padding: 30px 20px; }
            .profile-container { width: 120px; height: 120px; }
            .profile-circle { font-size: 55px; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>

    <header>
        <div class="profile-container">
            <div class="profile-circle">🌟</div>
        </div>
        <h1>둘궁</h1>
        <div class="nickname">@dukzy</div>
        <p class="info">경영학과 3학년</p>
    </header>

    <main>
        <div class="glass-card">
            
            <!-- 관심 분야 -->
            <div class="section">
                <div class="section-title"><span>🚀</span> 관심 분야</div>
                <div class="tag-container">
                    <div class="tag">유통</div>
                    <div class="tag">마케팅</div>
                    <div class="tag">창업</div>
                    <div class="tag">데이터 분석</div>
                </div>
            </div>

            <!-- 좋아하는 것 -->
            <div class="section">
                <div class="section-title"><span>❤️</span> 좋아하는 것</div>
                <div class="list-item">새로운 비즈니스 모델</div>
                <div class="list-item">데이터 기반 의사결정</div>
                <div class="list-item">커피와 여유</div>
            </div>

            <!-- 목표 -->
            <div class="section">
                <div class="section-title"><span>🎯</span> 나의 목표</div>
                <p class="goal-text">
                    "시장의 흐름을 읽고<br>새로운 가치를 만드는 비즈니스 전문가"
                </p>
            </div>

            <!-- 연락처 (Contact) -->
            <div class="section">
                <div class="section-title"><span>📞</span> Contact</div>
                <div class="contact-box">
                    <p>궁금한 점이 있다면 언제든 연락주세요!</p>
                    <a href="tel:01081899097" class="phone-link">📱 전화하기</a>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
